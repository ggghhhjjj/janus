<header class="header">
  <!-- Action Menu (Refresh) -->
  <div class="header__action-menu">
    @if (isRefreshing()) {
      <div class="header__loading-spinner" [attr.aria-label]="i18n.translate('loadingFifoAccounter')">
        <span class="spinner"></span>
      </div>
    } @else {
      <app-action-menu [items]="actionMenuItems()" [triggerAriaLabel]="i18n.translate('refreshTooltip')" />
    }
  </div>

  <nav class="header__nav" aria-label="Main navigation">
    <a
      routerLink="/"
      routerLinkActive="header__nav-link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="header__nav-link"
    >
      {{ i18n.translate('dashboard') }}
    </a>
    <a routerLink="/transactions" routerLinkActive="header__nav-link--active" class="header__nav-link">
      {{ i18n.translate('transactions') }}
    </a>
    <a routerLink="/import" routerLinkActive="header__nav-link--active" class="header__nav-link">
      {{ i18n.translate('importCsv') }}
    </a>
  </nav>

  <app-language-selector></app-language-selector>
</header>
