name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # file: ui-header requires the built library. Assumes janus-platform sibling layout.
      - name: Build ui-header library
        working-directory: ${{ github.workspace }}/../dynamic-components
        run: |
          npm ci
          npm run build:ui-header

      - name: Install dependencies
        run: npm ci

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Build Cordova browser app
        run: |
          cordova platform add browser
          cordova build browser

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: platforms/browser/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
